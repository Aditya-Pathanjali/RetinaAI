
dataset:
  root: "C:/Dissertation/Datasets/IDRiD/A. Segmentation/A. Segmentation"
  train_images: "1. Original Images/a. Training Set"
  test_images:  "1. Original Images/b. Testing Set"
  train_masks:  "2. All Segmentation Groundtruths/a. Training Set"
  test_masks:   "2. All Segmentation Groundtruths/b. Testing Set"

  lesion_classes:
    MA: "1. Microaneurysms"   # Microaneurysms
    HE: "2. Haemorrhages"     # Haemorrhages
    EX: "3. Hard Exudates"    # Hard Exudates
    SE: "4. Soft Exudates"    # Soft Exudates

  class_names: ["MA", "HE", "EX", "SE"]

  mask_suffixes:
    MA: "_MA"
    HE: "_HE"
    EX: "_EX"
    SE: "_SE"

  image_ext: ".jpg"
  mask_ext:  ".tif"

split:
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  random_seed: 42
  split_file:  "outputs/split_metadata.json"

preprocessing:
  image_size: 512
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]

  apply_clahe:         true
  clahe_clip_limit:    2.0
  clahe_tile_grid:     [8, 8]

  apply_bg_crop:       true
  apply_green_enhance: true
  apply_illum_correct: true
  apply_denoise:       false
  denoise_kernel:      3

augmentation:
  enabled: true
  p_hflip:          0.5
  p_vflip:          0.0
  p_rotate:         0.5
  rotate_limit:     45
  p_brightness:     0.4
  brightness_limit: 0.2
  contrast_limit:   0.2
  p_elastic:        0.3
  elastic_alpha:    120
  elastic_sigma:    6
  p_grid:           0.3
  p_gamma:          0.4
  gamma_limit:      [70, 130]
  p_gauss_noise:    0.2
  # New augmentations for exp_03
  p_sharpen:        0.3
  p_hue_sat:        0.2
  p_coarse_dropout: 0.2

model:
  name:          "AttentionUNet"
  encoder_name:  "resnet34"
  encoder_weights: "imagenet"
  in_channels:   3
  out_channels:  4
  base_features: 32
  encoder_depth: 4
  dropout_rate:  0.15
  use_attention: true
  bilinear:      false

loss:

  name:          "dice_focal"
  dice_weight:   0.6
  focal_weight:  0.4
  focal_alpha:   0.75
  focal_gamma:   2.0

  class_weights: [3.0, 1.0, 2.0, 3.0]

training:
  epochs:            150
  batch_size:        4
  num_workers:       4
  pin_memory:        true
  random_seed:       42

  optimizer:         "adamw"
  learning_rate:     3.0e-4
  weight_decay:      1.0e-4
  grad_clip:         1.0


  scheduler:         "cosine_warm"
  scheduler_T_0:     30
  scheduler_T_mult:  2
  min_lr:            1.0e-6

  
  warmup_epochs:     5

  early_stopping_patience: 30
  monitor_metric:    "val_dice"

  use_amp:           true

  checkpoint_dir:    "checkpoints"
  save_best_only:    false
  save_every_n:      25

evaluation:
  # Per-class thresholds
  threshold:
    MA: 0.15
    HE: 0.40
    EX: 0.25
    SE: 0.50
  
  # remove blobs
  min_area:
    MA: 2
    HE: 10
    EX: 5
    SE: 20
    
  use_tta: true
experiment:
  name:        "exp_04"
  output_root: "experiments"
  log_dir:     "outputs/logs"

logging:
  level:       "INFO"
  save_to_file: true
  log_file:    "outputs/logs/retinaai.log"

aptos_dataset:
  root: "C:/Dissertation/Datasets/archive"
  train_csv: "train_1.csv"
  val_csv: "valid.csv"
  test_csv: "test.csv"
  train_images: "train_images/train_images"
  val_images: "val_images/val_images"
  test_images: "test_images/test_images"
  image_ext: ".png"

classification_model:
  num_classes: 5
  lesion_feature_dim: 4
  pretrained: true
  dropout_rate: 0.3
  hidden_dim: 512

classification_training:
  epochs:            40
  batch_size:        8
  num_workers:       0
  pin_memory:        true
  random_seed:       42

  optimizer:         "adamw"
  learning_rate:     1.0e-4
  weight_decay:      1.0e-4
  grad_clip:         1.0

  scheduler:         "plateau"
  scheduler_patience: 5
  scheduler_factor:   0.5
  min_lr:            1.0e-7

  early_stopping_patience: 10
  monitor_metric:    "val_qwk"

  use_amp:           true
  checkpoint_dir:    "checkpoints_classifier"



