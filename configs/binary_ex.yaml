binary:
  target_class: "EX"

dataset:
  name: "binary_combined"
  class_names: ["EX"]
  datasets:
    - name: "idrid"
      root: "C:/Dissertation/Datasets/IDRiD/A. Segmentation/A. Segmentation"
      train_images: "1. Original Images/a. Training Set"
      test_images: "1. Original Images/b. Testing Set"
      train_masks: "2. All Segmentation Groundtruths/a. Training Set"
      test_masks: "2. All Segmentation Groundtruths/b. Testing Set"
      use_official_test: true
      lesion_classes: {MA: "1. Microaneurysms", HE: "2. Haemorrhages", EX: "3. Hard Exudates", SE: "4. Soft Exudates"}
      mask_suffixes: {MA: "_MA", HE: "_HE", EX: "_EX", SE: "_SE"}
      image_ext: ".jpg"
      mask_ext: ".tif"
    - name: "ddr"
      root: "C:/Dissertation/Datasets/DDR_final/DDR-dataset/lesion_segmentation"
      train_images: "train/image"
      test_images: "test/image"
      train_masks: "train/label"
      test_masks: "test/label"
      use_official_test: true
      lesion_classes: {MA: "MA", HE: "HE", EX: "EX", SE: "SE"}
      mask_suffixes: {MA: "", HE: "", EX: "", SE: ""}
      image_ext: ".jpg"
      mask_ext: ".tif"
    - name: "eophtha"
      root: "C:/Dissertation/Datasets/E-Ophtha"
      use_official_test: false

split:
  train_ratio: 0.85
  val_ratio: 0.15
  random_seed: 42

preprocessing:
  image_size: 768
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  apply_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  apply_bg_crop: true
  apply_green_enhance: true
  apply_illum_correct: true
  apply_denoise: false
  denoise_kernel: 3

patch_training:
  enabled: false

augmentation:
  enabled: true
  p_hflip: 0.5
  p_vflip: 0.0
  p_rotate: 0.5
  rotate_limit: 35
  p_brightness: 0.4
  brightness_limit: 0.2
  contrast_limit: 0.2
  p_elastic: 0.2
  elastic_alpha: 80
  elastic_sigma: 6
  p_grid: 0.2
  p_gamma: 0.4
  gamma_limit: [70, 130]
  p_gauss_noise: 0.2
  p_sharpen: 0.2
  p_hue_sat: 0.2
  p_coarse_dropout: 0.1

model:
  name: "AttentionUNet"
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 3
  out_channels: 1
  base_features: 32
  encoder_depth: 4
  dropout_rate: 0.15
  use_attention: true
  bilinear: false

loss:
  name: "bce_dice"
  bce_weight: 0.4
  dice_weight: 0.6

training:
  epochs: 120
  batch_size: 2
  num_workers: 4
  pin_memory: true
  random_seed: 42
  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  scheduler: "cosine"
  scheduler_T_max: 120
  min_lr: 1.0e-7
  warmup_epochs: 5
  early_stopping_patience: 25
  use_amp: true
  checkpoint_dir: "checkpoints"
  save_best_only: false
  save_every_n: 25

evaluation:
  threshold: {EX: 0.40}
  threshold_search: {EX: [0.20, 0.60]}
  min_area: {EX: 50}
  min_area_search: {EX: [20, 100]}
  use_tta: true

experiment:
  output_root: "experiments"
  name: "exp_11_ex_binary_full"

logging:
  level: "INFO"
  save_to_file: true
